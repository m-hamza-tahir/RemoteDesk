name: Build RemoteDesk Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build RemoteDesk EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RemoteDesk client\client.py

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Installer
        shell: powershell
        run: |
          iscc installer\RemoteDesk.iss

      - name: Verify Installer
        shell: powershell
        run: |
          if (!(Test-Path "installer\output\RemoteDesk-Setup.exe")) {
            Write-Error "RemoteDesk-Setup.exe was not created."
            exit 1
          }

          Get-Item "installer\output\RemoteDesk-Setup.exe"

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "installer/output/RemoteDesk-Setup.exe" `
            --title "RemoteDesk $env:RELEASE_TAG" `
            --generate-notes `
            --target "${{ github.sha }}"
