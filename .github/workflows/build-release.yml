name: Build and Release RemoteDesk Client

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build client EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RemoteDesk client\client.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-Windows-Client
          path: dist/RemoteDesk.exe

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RemoteDesk.exe
          generate_release_notes: true
